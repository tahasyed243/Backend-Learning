<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/public/STK Logo.png" />
  <title>JWT Auth || STK</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Slide animations */
    .slide-left {
      transform: translateX(-100%);
      transition: transform 0.4s ease, opacity 0.4s ease;
      opacity: 0;
      position: absolute;
      width: 100%;
    }
    .slide-right {
      transform: translateX(100%);
      transition: transform 0.4s ease, opacity 0.4s ease;
      opacity: 0;
      position: absolute;
      width: 100%;
    }
    .active {
      transform: translateX(0);
      opacity: 1;
      position: relative;
    }
  </style>
</head>

<body class="bg-gray-900 min-h-screen flex items-center justify-center">

  <!-- Auth Card -->
  <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md relative overflow-hidden">
    <h1 class="text-3xl font-bold text-white mb-6 text-center">JWT Auth || STK</h1>

    <!-- Toggle Buttons -->
    <div class="flex justify-center mb-6 relative z-10">
      <button id="loginToggle" class="px-4 py-2 rounded-l-lg bg-blue-700 text-white font-semibold hover:bg-blue-800 transition">Login</button>
      <button id="registerToggle" class="px-4 py-2 rounded-r-lg bg-purple-600 text-white font-semibold hover:bg-purple-700 transition">Register</button>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="flex flex-col gap-4 active">
      <input id="loginEmail" type="email" placeholder="Email" class="w-full p-3 rounded-lg border border-gray-600 bg-gray-700 text-white placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
      <input id="loginPassword" type="password" placeholder="Password" class="w-full p-3 rounded-lg border border-gray-600 bg-gray-700 text-white placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
      <button type="button" onclick="login()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-semibold transition">Login</button>
    </form>

    <!-- Register Form -->
    <form id="registerForm" class="flex flex-col gap-4 slide-right">
      <input id="regName" type="text" placeholder="Name" class="w-full p-3 rounded-lg border border-gray-600 bg-gray-700 text-white placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500">
      <input id="regEmail" type="email" placeholder="Email" class="w-full p-3 rounded-lg border border-gray-600 bg-gray-700 text-white placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500">
      <input id="regPassword" type="password" placeholder="Password" class="w-full p-3 rounded-lg border border-gray-600 bg-gray-700 text-white placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500">
      <button type="button" onclick="register()" class="w-full bg-purple-600 hover:bg-purple-700 text-white py-3 rounded-lg font-semibold transition">Register</button>
    </form>
  </div>

  <script>
    const API = "http://localhost:5000";

    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");
    const loginToggle = document.getElementById("loginToggle");
    const registerToggle = document.getElementById("registerToggle");

    // Toggle forms with animation
    loginToggle.addEventListener("click", () => {
      loginForm.classList.add("active");
      loginForm.classList.remove("slide-left", "slide-right");
      registerForm.classList.add("slide-right");
      registerForm.classList.remove("active", "slide-left");
      loginToggle.classList.replace("bg-blue-600", "bg-blue-700");
      registerToggle.classList.replace("bg-purple-700", "bg-purple-600");
    });

    registerToggle.addEventListener("click", () => {
      registerForm.classList.add("active");
      registerForm.classList.remove("slide-left", "slide-right");
      loginForm.classList.add("slide-left");
      loginForm.classList.remove("active", "slide-right");
      registerToggle.classList.replace("bg-purple-600", "bg-purple-700");
      loginToggle.classList.replace("bg-blue-700", "bg-blue-600");
    });

    // Register
    async function register() {
      const name = document.getElementById("regName").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const password = document.getElementById("regPassword").value.trim();
      if (!name || !email || !password) return alert("All fields required!");

      try {
        const res = await fetch(`${API}/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();
        if (data.token) {
          localStorage.setItem("token", data.token);
          alert("Registered successfully!");
          window.location.href = "dashboard.html";
        } else {
          alert(data.error || "Registration failed");
        }
      } catch (err) {
        alert("Error: " + err);
      }
    }

    // Login
    async function login() {
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value.trim();
      if (!email || !password) return alert("All fields required!");

      try {
        const res = await fetch(`${API}/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (data.token) {
          localStorage.setItem("token", data.token);
          alert("Login successful!");
          window.location.href = "dashboard.html";
        } else {
          alert(data.error || "Login failed");
        }
      } catch (err) {
        alert("Error: " + err);
      }
    }
  </script>
</body>
</html>
